---
- name: Disable COPR Hyprland repos
  ansible.builtin.include_tasks: copr_disable.yml
  vars:
    hyprland_copr_disable: "{{ [hyprland_copr_repo] + hyprland_copr_obsolete }}"

- name: Ensure RPM build tools are installed
  become: true
  ansible.builtin.package:
    name:
      - mock
      - rpm-build
      - rpmdevtools
      - createrepo_c
    state: present

- name: Ensure user is in the mock group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: mock
    append: true

- name: Ensure build directories exist
  become: true
  ansible.builtin.file:
    path: "{{ hyprland_local_dir }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0755"
  loop:
    - sources
    - srpms
    - repo
    - mock

# Any change under files/specs starts a new build generation. The generation is
# part of %dist, so every package gets a new NVR and the whole chain is rebuilt
# against the changed libraries (covers soname bumps without manual release bumps).
- name: Hash spec files
  ansible.builtin.shell:
    cmd: set -o pipefail && find . -type f ! -name '*.md' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
    chdir: "{{ role_path }}/files/specs"
    executable: /bin/bash
  delegate_to: localhost  # role_path is a controller path
  register: hyprland_local_specs_hash
  changed_when: false

- name: Read current build generation
  ansible.builtin.slurp:
    src: "{{ hyprland_local_dir }}/generation.json"
  register: hyprland_local_generation_file
  failed_when: false

- name: Set build generation
  vars:
    _previous: "{{ hyprland_local_generation_file.content | default('e30=') | b64decode | from_json }}"
  ansible.builtin.set_fact:
    hyprland_local_generation: >-
      {{ _previous.generation
         if _previous.hash | default('') == hyprland_local_specs_hash.stdout
         else now(utc=true, fmt='%Y%m%d%H%M') }}
    hyprland_local_fedora: "{{ hyprland_local_chroot.split('-')[1] }}"

- name: Set build dist tag
  ansible.builtin.set_fact:
    hyprland_local_dist: ".fc{{ hyprland_local_fedora }}.{{ hyprland_local_generation }}"

- name: Save build generation
  ansible.builtin.copy:
    content: "{{ {'hash': hyprland_local_specs_hash.stdout, 'generation': hyprland_local_generation} | to_json }}"
    dest: "{{ hyprland_local_dir }}/generation.json"
    mode: "0644"

# mock names the results directory after the config file, so it must match the chroot name
- name: Write mock config
  ansible.builtin.template:
    src: mock.cfg.j2
    dest: "{{ hyprland_local_dir }}/mock/{{ hyprland_local_chroot }}.cfg"
    mode: "0644"

- name: Copy spec files and local sources
  ansible.builtin.copy:
    src: "specs/{{ item }}/"
    dest: "{{ hyprland_local_dir }}/sources/{{ item }}/"
    mode: "0644"
  loop: "{{ hyprland_local_specs }}"

- name: Resolve package NVRs from spec files
  ansible.builtin.command:
    argv:
      - rpmspec
      - -q
      - --srpm
      - --define
      - "dist {{ hyprland_local_dist }}"
      - --define
      - "fedora {{ hyprland_local_fedora }}"
      - --qf
      - "%{name}-%{version}-%{release}"
      - "{{ hyprland_local_dir }}/sources/{{ item }}/{{ item }}.spec"
  loop: "{{ hyprland_local_specs }}"
  register: hyprland_local_nvrs
  changed_when: false

- name: Download upstream sources
  ansible.builtin.command:
    argv:
      - spectool
      - --get-files
      - --directory
      - "{{ hyprland_local_dir }}/sources/{{ item.item }}"
      - "{{ hyprland_local_dir }}/sources/{{ item.item }}/{{ item.item }}.spec"
    creates: "{{ hyprland_local_dir }}/srpms/{{ item.stdout }}.src.rpm"
  loop: "{{ hyprland_local_nvrs.results }}"
  loop_control:
    label: "{{ item.stdout }}"

- name: Build source RPMs
  ansible.builtin.command:
    argv:
      - rpmbuild
      - -bs
      - --define
      - "dist {{ hyprland_local_dist }}"
      - --define
      - "fedora {{ hyprland_local_fedora }}"
      - --define
      - "_sourcedir {{ hyprland_local_dir }}/sources/{{ item.item }}"
      - --define
      - "_srcrpmdir {{ hyprland_local_dir }}/srpms"
      - "{{ hyprland_local_dir }}/sources/{{ item.item }}/{{ item.item }}.spec"
    creates: "{{ hyprland_local_dir }}/srpms/{{ item.stdout }}.src.rpm"
  loop: "{{ hyprland_local_nvrs.results }}"
  loop_control:
    label: "{{ item.stdout }}"

- name: Check which packages are already built
  ansible.builtin.stat:
    path: "{{ hyprland_local_dir }}/repo/results/{{ hyprland_local_chroot }}/{{ item.stdout }}/success"
  loop: "{{ hyprland_local_nvrs.results }}"
  loop_control:
    label: "{{ item.stdout }}"
  register: hyprland_local_built

# mock --chain builds in list order, adds each result to the local repo before
# the next build, and skips packages that already have a success marker.
# A full build from scratch takes a long time.
- name: Build RPMs with mock
  become: true
  become_user: "{{ ansible_user_id }}"  # fresh login picks up the mock group
  ansible.builtin.command:
    argv: "{{ ['mock', '--chain', '-r', hyprland_local_dir ~ '/mock/' ~ hyprland_local_chroot ~ '.cfg',
               '--localrepo', hyprland_local_dir ~ '/repo']
              + hyprland_local_nvrs.results | map(attribute='stdout')
                | map('regex_replace', '^(.*)$', hyprland_local_dir ~ '/srpms/\\1.src.rpm') | list }}"
  when: hyprland_local_built.results | rejectattr('stat.exists') | list | length > 0
  changed_when: true

- name: Ensure local Hyprland repo is configured
  become: true
  ansible.builtin.yum_repository:
    name: hyprland-local
    description: Hyprland (local mock build)
    # $releasever keeps dnf system-upgrade from pulling builds for the old release
    baseurl: "file://{{ hyprland_local_dir }}/repo/results/fedora-$releasever-$basearch/"
    gpgcheck: false
    metadata_expire: "0"
    # Hide same-name packages in Fedora and COPR repos, even with a higher EVR
    priority: "1"
    # Fail instead of silently skipping when the release has no builds yet
    skip_if_unavailable: false

- name: Ensure Hyprland stack is at the latest local build  # noqa: package-latest - upgrades are driven by spec changes
  become: true
  ansible.builtin.dnf:
    name: "{{ hyprland_local_install }}"
    state: latest
    update_cache: true
    # Removes leftovers from the old COPR (e.g. hyprland-qtutils, hyprpicker)
    # that link against an older libhyprutils soname
    allowerasing: true
