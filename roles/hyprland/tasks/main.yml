---
- name: Ensure Hyprland is installed
  become: true
  ansible.builtin.package:
    name: hyprland
    state: present
  when: ansible_distribution != "Fedora"

- name: Install Hyprland from local build
  ansible.builtin.include_tasks: local.yml
  when:
    - ansible_distribution == "Fedora"
    - hyprland_source == "local"

- name: Install Hyprland from COPR
  ansible.builtin.include_tasks: copr.yml
  when:
    - ansible_distribution == "Fedora"
    - hyprland_source == "copr"

- name: Ensure Hyprland dependency packages are installed
  become: true
  ansible.builtin.package:
    name: "{{ hyprland_packages[ansible_distribution] }}"
    state: present
