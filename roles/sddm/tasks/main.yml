---
- name: Ensure SDDM packages are installed
  become: true
  ansible.builtin.package:
    name: "{{ sddm_packages[ansible_distribution] }}"
    state: present

- name: Ensure wayland-sessions directory exists
  become: true
  ansible.builtin.file:
    path: /usr/share/wayland-sessions
    state: directory
    mode: "0755"

- name: Check if Hyprland session file exists
  ansible.builtin.stat:
    path: /usr/share/wayland-sessions/hyprland.desktop
  register: hyprland_session

- name: Ensure Hyprland session file exists
  become: true
  ansible.builtin.copy:
    dest: /usr/share/wayland-sessions/hyprland.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=Hyprland
      Comment=An intelligent dynamic tiling Wayland compositor
      Exec=Hyprland
      Type=Application
  when: not hyprland_session.stat.exists

- name: Clone sddm-astronaut-theme
  become: true
  ansible.builtin.git:
    repo: https://github.com/Keyitdev/sddm-astronaut-theme.git
    dest: /usr/share/sddm/themes/sddm-astronaut-theme
    version: "{{ sddm_astronaut_version }}"

- name: Configure astronaut theme flavor
  become: true
  ansible.builtin.lineinfile:
    path: /usr/share/sddm/themes/sddm-astronaut-theme/metadata.desktop
    regexp: "^ConfigFile="
    line: "ConfigFile=Themes/{{ sddm_astronaut_flavor }}.conf"

- name: Configure SDDM
  become: true
  ansible.builtin.copy:
    dest: /etc/sddm.conf
    mode: "0644"
    content: |
      [Theme]
      Current={{ sddm_theme }}

      [General]
      InputMethod=

- name: Ensure graphical target is the default boot target
  become: true
  ansible.builtin.command:
    cmd: systemctl set-default graphical.target
  changed_when: false

- name: Ensure SDDM service is enabled on boot
  become: true
  ansible.builtin.command:
    cmd: systemctl enable sddm --force
  changed_when: false
